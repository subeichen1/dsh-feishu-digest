name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.17', '20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run signature and body tests
        run: node test/sign.test.js

      - name: Run listener, config and alert tests
        run: node test/listener.test.js

      - name: Run notification pipeline tests
        run: node test/pipeline.test.js
